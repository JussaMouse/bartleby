<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bartleby</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Bartleby</h1>
      <div class="header-right">
        <span id="status" class="status">connecting...</span>
      </div>
    </header>

    <main id="panels"></main>

    <footer>
      <div class="footer-views">
        <button onclick="addPanel('Inbox')">Inbox</button>
        <button onclick="addPanel('Next Actions')">Next Actions</button>
        <button onclick="addPanel('Waiting For')">Waiting</button>
        <button onclick="addPanel('All Projects')">Projects</button>
        <button onclick="addPanel('All Notes')">Notes</button>
        <button onclick="addPanel('All Events')">Events</button>
        <button onclick="addPanel('Contacts')">Contacts</button>
        <button onclick="addPanel('repl')">REPL</button>
      </div>
      <div class="footer-capture">
        <input id="capture-input" type="text" placeholder="Quick capture..." autocomplete="off">
        <button onclick="quickCapture()">Capture</button>
      </div>
    </footer>
  </div>

  <!-- Drop overlay -->
  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-message">
      <span>Drop file to import</span>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden" onclick="closeLightbox(event)">
    <div class="lightbox-content">
      <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
